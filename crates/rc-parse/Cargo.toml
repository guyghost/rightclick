[package]
name = "rc-parse"
description = "TextMate grammar engine: .tmLanguage loading + incremental line parsing (modern port of TextMate's ng::parse)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rc-scope = { path = "../rc-scope" }
rc-buffer = { path = "../rc-buffer" }
onig = "6"
plist = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"